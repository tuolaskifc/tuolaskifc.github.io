<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'zh-CN' }}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% if page.title %}{{ page.title }} · {{ site.author }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 }}">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Noto+Sans+SC:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet" />
  {% if page.mathjax %}
  <script>
    MathJax = {
      tex: { inlineMath: [['$','$'], ['\\(','\\)']], displayMath: [['$$','$$'], ['\\[','\\]']] },
      svg: { fontCache: 'global' }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
  {% endif %}
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />
</head>
<body>

<!-- APEX Legends style Splash Screen — only on home page -->
<div class="splash" id="splash">
  <div class="splash-noise"></div>
  <div class="splash-center">
    <div class="splash-logo">MIEMIE</div>
    <div class="splash-sub">LIU YANG</div>
    <button class="splash-btn" id="splashBtn">
      <svg class="splash-btn-icon" viewBox="0 0 18 18"><path d="M15.25 9.5L3.25 16.5V2.5L15.25 9.5Z"/></svg>
      继续
    </button>
  </div>
  <div class="splash-bottom">
    <span>ESC 退出</span>
    <div class="splash-bottom-center">
      <button class="splash-theme-btn" id="splashThemeToggle">🌙</button>
      <span class="splash-lang-btn">中/EN</span>
    </div>
    <span>©2026 刘阳</span>
  </div>
</div>

<script>
(function() {
  // Only show splash on the home page
  if (window.location.pathname.replace(/\/$/, '') !== '' && window.location.pathname !== '/index.html') return;

  const splash = document.getElementById('splash');
  if (!splash) return;

  // 本次会话已经进入过网站 → 不再显示 splash
  if (sessionStorage.getItem('splashEntered')) {
    splash.style.display = 'none';
    return;
  }

  function hideSplash() {
    if (splash.classList.contains('splash-hidden')) return;
    splash.classList.add('splash-hidden');
    sessionStorage.setItem('splashEntered', '1');
    setTimeout(function() { splash.style.display = 'none'; }, 700);
  }

  splash.addEventListener('click', function(e) {
    var bottom = splash.querySelector('.splash-bottom');
    if (bottom && bottom.contains(e.target)) return;
    hideSplash();
  });

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') hideSplash();
  });

  // Sync theme toggle
  var splashThemeBtn = document.getElementById('splashThemeToggle');
  if (splashThemeBtn) {
    var currentTheme = localStorage.getItem('theme');
    if (!currentTheme) {
      currentTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    splashThemeBtn.textContent = currentTheme === 'dark' ? '☀️' : '🌙';
    splashThemeBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      var body = document.body;
      var isDark = body.classList.contains('dark');
      var newMode = isDark ? 'light' : 'dark';
      body.classList.remove('light', 'dark');
      if (newMode === 'dark') {
        body.classList.add('dark');
        splashThemeBtn.textContent = '☀️';
      } else {
        body.classList.add('light');
        splashThemeBtn.textContent = '🌙';
      }
      localStorage.setItem('theme', newMode);
    });
  }

  // Prevent body scroll while splash is visible
  document.body.style.overflow = 'hidden';
  setTimeout(function() { document.body.style.overflow = ''; }, 700);

  splash.style.display = 'flex';
})();
</script>

  <nav>
    <div class="container">
      <a href="{{ '/' | relative_url }}" class="nav-brand">{{ site.author }}</a>
      <div class="nav-right">
        <div class="nav-links">
          <a href="{{ '/' | relative_url }}">首页</a>
          <a href="{{ '/#research' | relative_url }}">研究兴趣</a>
          <a href="{{ '/blog/' | relative_url }}">博客</a>
          <a href="{{ '/#about' | relative_url }}">关于</a>
        </div>
        <button class="theme-toggle" id="themeToggle" aria-label="切换主题">🌙</button>
        <span class="admin-badge" id="adminBadge" style="display:none;">🔓 站长</span>
      </div>
    </div>
  </nav>

  <main>
    {{ content }}
  </main>

  <footer>
    <div class="container">
      <p>© {{ site.time | date: '%Y' }} {{ site.author }} · Powered by GitHub Pages</p>
    </div>
  </footer>

  <script>
    const toggle = document.getElementById('themeToggle');
    const body = document.body;

    function applyTheme(mode) {
      body.classList.remove('light', 'dark');
      if (mode === 'dark') {
        body.classList.add('dark');
        toggle.textContent = '☀️';
      } else {
        body.classList.add('light');
        toggle.textContent = '🌙';
      }
      localStorage.setItem('theme', mode);
    }

    const saved = localStorage.getItem('theme');
    if (saved) {
      applyTheme(saved);
    } else {
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      applyTheme(prefersDark ? 'dark' : 'light');
    }

    toggle.addEventListener('click', () => {
      const isDark = body.classList.contains('dark');
      applyTheme(isDark ? 'light' : 'dark');
    });
  </script>

  <script>
    // ===== 站长模式 (Konami Code: ↑↑↓↓←→←→BA) =====
    (function() {
      const KONAMI = ['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];
      const EASTER = ['i','l','o','v','e','c','h','e','n'];
      const APEX = ['a','p','e','x','l','e','g','e','n','d'];

      let buffer = [];
      let adminOn = sessionStorage.getItem('adminMode') === '1';

      function applyAdmin() {
        // 显示/隐藏私密文章
        document.querySelectorAll('.post-card[data-private="true"]').forEach(function(el) {
          el.style.display = adminOn ? 'block' : 'none';
        });
        // 导航栏徽章
        var badge = document.getElementById('adminBadge');
        if (badge) badge.style.display = adminOn ? 'inline-block' : 'none';
      }

      function toast(msg) {
        var t = document.createElement('div');
        t.className = 'admin-toast';
        t.textContent = msg;
        document.body.appendChild(t);
        setTimeout(function() { t.classList.add('show'); }, 10);
        setTimeout(function() {
          t.classList.remove('show');
          setTimeout(function() { t.remove(); }, 400);
        }, 2200);
      }

      document.addEventListener('keydown', function(e) {
        // 只跟踪普通按键，忽略功能键组合
        if (e.ctrlKey || e.metaKey || e.altKey) return;
        buffer.push(e.key.length === 1 ? e.key.toLowerCase() : e.key);
        if (buffer.length > 11) buffer.shift();

        // Konami Code → 切换站长模式
        if (buffer.slice(-KONAMI.length).join(',') === KONAMI.join(',')) {
          adminOn = !adminOn;
          sessionStorage.setItem('adminMode', adminOn ? '1' : '0');
          applyAdmin();
          toast(adminOn ? '🔓 站长模式已开启' : '🔒 站长模式已关闭');
          buffer = [];
        }
        // ilovechen → 化学人格鉴定
        else if (buffer.slice(-EASTER.length).join(',') === EASTER.join(',')) {
          window.location.href = '{{ '/easter-egg/' | relative_url }}';
          buffer = [];
        }
        // apexlegend → B站视频彩蛋
        else if (buffer.slice(-APEX.length).join(',') === APEX.join(',')) {
          window.location.href = '{{ '/easter-egg-apex/' | relative_url }}';
          buffer = [];
        }
      });

      applyAdmin();
    })();

    // ===== 彩蛋入口（手机端）：连点页脚版权 5 次 =====
    (function() {
      var target = document.querySelector('footer p');
      if (!target) return;
      var taps = 0, timer = null;
      target.addEventListener('click', function() {
        taps++;
        clearTimeout(timer);
        timer = setTimeout(function() { taps = 0; }, 1200);
        if (taps >= 5) {
          taps = 0;
          window.location.href = '{{ '/easter-egg/' | relative_url }}';
        }
      });
    })();
  </script>

</body>
</html>
