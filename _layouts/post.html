---
layout: default
---

<article class="post-page container">
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    <div class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{% if page.date_display %}{{ page.date_display }}{% else %}{{ page.date | date: "%Y-%m-%d" }}{% endif %}</time>
      {% if page.course %}
      <span class="post-tag course-tag">🎓 {{ page.course }}</span>
      {% endif %}
      {% if page.tags %}
      <span class="post-tag">{{ page.tags | join: " · " }}</span>
      {% endif %}
    </div>
  </header>
  <div class="post-content">
    {{ content }}
  </div>
</article>
